# Включаем DEBUG-логирование, чтобы увидеть все ошибки
logging.level.root=DEBUG
logging.level.org.springframework=DEBUG
logging.level.com.p2p=DEBUG

# Отключаем автоконфигурацию базы данных (пока не нужна)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Настройка порта (Render передаёт порт через переменную PORT)
server.port=${PORT:8080}

# Настройка для работы за прокси (чтобы правильно обрабатывать HTTPS)
server.forward-headers-strategy=native